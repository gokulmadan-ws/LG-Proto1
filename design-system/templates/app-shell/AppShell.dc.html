<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="App Shell" description="Full-screen product shell: top nav with tabs, left icon rail, and a content slot — dark, rounded canvas." -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: url("assets/blob-texture.png") center / cover no-repeat fixed, #121417; }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--accent-hover); }
</style>
</helmet>

<div style="display: flex; flex-direction: column; width: 100vw; height: 100vh; background: transparent; font-family: var(--font-sans); overflow: hidden; color: #fff">

  <!-- ===== Top header ===== -->
  <header style="display: flex; align-items: center; justify-content: space-between; height: 72px; flex: 0 0 72px; padding: 0 24px; background: transparent; position: relative; z-index: 2">

    <!-- left cluster -->
    <div style="display: flex; align-items: center; gap: 8px">
      <!-- W logo -->
      <svg width="42" height="42" viewBox="0 0 43 43" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Whitespace" style="margin-right:12px; flex:0 0 auto;">
        <path d="M21.5 0.75C32.9599 0.75 42.25 10.0401 42.25 21.5C42.25 32.9599 32.9599 42.25 21.5 42.25C10.0401 42.25 0.75 32.9599 0.75 21.5C0.75 10.0401 10.0401 0.75 21.5 0.75Z" fill="#1A1B22"></path>
        <path d="M21.5 0.75C32.9599 0.75 42.25 10.0401 42.25 21.5C42.25 32.9599 32.9599 42.25 21.5 42.25C10.0401 42.25 0.75 32.9599 0.75 21.5C0.75 10.0401 10.0401 0.75 21.5 0.75Z" stroke="#3E3F47" stroke-width="1.5"></path>
        <path d="M13.1012 17.7963C14.2649 17.7963 15.2023 16.8458 15.2023 15.6658C15.2023 14.4859 14.2649 13.5354 13.1012 13.5354C11.9374 13.5354 11 14.4859 11 15.6658C11 16.8458 11.9374 17.7963 13.1012 17.7963Z" fill="white"></path>
        <path d="M18.5318 28.1864L23.4453 16.518C23.8978 15.4036 23.3806 14.1581 22.2816 13.6665C21.1825 13.2076 19.9541 13.732 19.5016 14.8136L14.6204 26.5148C14.1679 27.6292 14.6851 28.8747 15.7518 29.3335C16.8509 29.7924 18.0793 29.268 18.5318 28.1864Z" fill="white"></path>
        <path d="M26.9364 28.1864L31.8176 16.518C32.3025 15.4036 31.7853 14.1581 30.6862 13.6665C29.5871 13.2076 28.3588 13.732 27.9062 14.8136L23.0251 26.5148C22.5725 27.6292 23.0897 28.8747 24.1565 29.3335C25.2555 29.7924 26.4839 29.268 26.9364 28.1864Z" fill="white"></path>
      </svg>

      <!-- nav tabs -->
      <button style="display: flex; align-items: center; gap: 9px; height: 64px; padding: 0 14px; background: transparent; border: none; cursor: pointer; color: #76777F; font-family: var(--font-sans); font-size: 15px; font-weight: 500" style-hover="color:#C1C1CC;">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7.1999 3.5999C7.1999 2.9374 6.6624 2.3999 5.9999 2.3999H3.5999C2.9374 2.3999 2.3999 2.9374 2.3999 3.5999V5.9999C2.3999 6.6624 2.9374 7.1999 3.5999 7.1999H5.9999C6.6624 7.1999 7.1999 6.6624 7.1999 5.9999V3.5999ZM7.1999 9.9999C7.1999 9.3374 6.6624 8.7999 5.9999 8.7999H3.5999C2.9374 8.7999 2.3999 9.3374 2.3999 9.9999V12.3999C2.3999 13.0624 2.9374 13.5999 3.5999 13.5999H5.9999C6.6624 13.5999 7.1999 13.0624 7.1999 12.3999V9.9999ZM8.7999 3.5999V5.9999C8.7999 6.6624 9.3374 7.1999 9.9999 7.1999H12.3999C13.0624 7.1999 13.5999 6.6624 13.5999 5.9999V3.5999C13.5999 2.9374 13.0624 2.3999 12.3999 2.3999H9.9999C9.3374 2.3999 8.7999 2.9374 8.7999 3.5999ZM13.5999 9.9999C13.5999 9.3374 13.0624 8.7999 12.3999 8.7999H9.9999C9.3374 8.7999 8.7999 9.3374 8.7999 9.9999V12.3999C8.7999 13.0624 9.3374 13.5999 9.9999 13.5999H12.3999C13.0624 13.5999 13.5999 13.0624 13.5999 12.3999V9.9999Z" fill="currentColor"></path>
        </svg>
        <span>Apps</span>
      </button>

      <button style="display: flex; align-items: center; gap: 9px; height: 64px; padding: 0 14px; background: transparent; border: none; cursor: pointer; color: #76777F; font-family: var(--font-sans); font-size: 15px; font-weight: 500" style-hover="color:#C1C1CC;">
        <i class="fa-solid fa-comment" style="font-size: 16px"></i>
        <span>Chat</span>
      </button>

      <!-- active tab -->
      <div style="position:relative; display:flex; align-items:center; height:64px; padding:0 16px 0 12px;">
        <div style="display:flex; align-items:center; gap:11px;">
          <span style="width: 24px; height: 24px; border-radius: 6px; background: #26272E; display: flex; align-items: center; justify-content: center">
            <i class="fa-solid fa-asterisk" style="font-size: 14px; color: #fff"></i>
          </span>
          <span style="font-size: 14px; font-weight: 500; color: #fff; white-space: nowrap">App Name</span>
          <button aria-label="Close tab" style="background:transparent; border:none; cursor:pointer; color:#8A8B93; padding:6px; display:flex; align-items:center;" style-hover="color:#fff;">
            <i class="fa-solid fa-xmark" style="font-size:16px;"></i>
          </button>
        </div>
        <span style="position: absolute; left: 8px; right: 8px; bottom: -4px; height: 2.5px; background: var(--accent); border-radius: 2px"></span>
      </div>
    </div>

    <!-- right cluster -->
    <div style="display: flex; align-items: center; gap: 16px">
      <button aria-label="Share" style="width: 32px; height: 32px; border-radius: 9999px; border: 1px solid #34353D; background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center" style-hover="background:#1A1B22;">
        <svg width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="3.5 4.8 15 12.4">
          <path d="M10.2998 6.7999C10.2998 7.09959 10.2057 7.37521 10.046 7.60271L10.6848 8.9699C10.8991 8.92396 11.1223 8.8999 11.3498 8.8999C12.1395 8.8999 12.8591 9.19084 13.4126 9.6699L15.2085 8.35303C15.2041 8.30271 15.1998 8.2524 15.1998 8.1999C15.1998 7.42771 15.8276 6.7999 16.5998 6.7999C17.372 6.7999 17.9998 7.42771 17.9998 8.1999C17.9998 8.97209 17.372 9.5999 16.5998 9.5999C16.3985 9.5999 16.2082 9.55834 16.0354 9.48178L14.2416 10.7987C14.4079 11.1815 14.4998 11.6058 14.4998 12.0499C14.4998 12.3912 14.4451 12.7215 14.3445 13.0299L15.9195 13.9749C16.1207 13.8633 16.3526 13.7999 16.5998 13.7999C17.372 13.7999 17.9998 14.4277 17.9998 15.1999C17.9998 15.9721 17.372 16.5999 16.5998 16.5999C15.8276 16.5999 15.1998 15.9721 15.1998 15.1999V15.1758L13.6226 14.2287C13.0495 14.828 12.2423 15.1999 11.3498 15.1999C9.85133 15.1999 8.5957 14.1521 8.27852 12.7499H6.61383C6.37102 13.1677 5.92039 13.4499 5.40195 13.4499C4.62977 13.4499 4.00195 12.8221 4.00195 12.0499C4.00195 11.2777 4.62977 10.6499 5.40195 10.6499C5.92039 10.6499 6.3732 10.9321 6.61383 11.3499H8.27852C8.44258 10.628 8.85383 10.0024 9.4182 9.56271L8.77945 8.19553C8.06195 8.13209 7.49977 7.53271 7.49977 6.7999C7.49977 6.02771 8.12758 5.3999 8.89977 5.3999C9.67195 5.3999 10.2998 6.02771 10.2998 6.7999ZM11.3498 13.0999C11.9295 13.0999 12.3998 12.6296 12.3998 12.0499C12.3998 11.4702 11.9295 10.9999 11.3498 10.9999C10.7701 10.9999 10.2998 11.4702 10.2998 12.0499C10.2998 12.6296 10.7701 13.0999 11.3498 13.0999Z" fill="currentColor"></path>
        </svg>
      </button>
      <button aria-label="Notifications" style="width: 32px; height: 32px; border-radius: 9999px; border: 1px solid #34353D; background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center" style-hover="background:#1A1B22;">
        <i class="fa-solid fa-bell" style="font-size: 14px"></i>
      </button>
      <button aria-label="Settings" style="width: 32px; height: 32px; border-radius: 9999px; border: 1px solid #34353D; background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center" style-hover="background:#1A1B22;">
        <i class="fa-solid fa-gear" style="font-size: 14px"></i>
      </button>
      <button aria-label="Account" style="width: 32px; height: 32px; border-radius: 9999px; border: none; background: #2E9E4B; color: #fff; cursor: pointer; font-family: var(--font-sans); font-size: 14px; font-weight: 400; letter-spacing: 0.02em">JS</button>
    </div>
  </header>

  <!-- ===== Body: sidebar + content ===== -->
  <div style="display: flex; flex: 1 1 auto; min-height: 0; margin: 0 12px 0; border: 1px solid #3E3F47; border-radius: 14px 14px 0 0; background: #08090B; overflow: hidden; border-bottom: none">

    <!-- rail -->
    <nav style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 16px 0; background: transparent; border-right: 1px solid #3E3F47">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
        <button aria-label="Home" style="width: 44px; height: 44px; border-radius: 6px; border: none; background: rgba(31,111,235,0.14); color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center">
          <i class="fa-solid fa-house" style="font-size: 20px"></i>
        </button>
        <button aria-label="Files" style="width: 40px; height: 40px; border-radius: 8px; border: none; background: transparent; color: #8A8B93; cursor: pointer; display: flex; align-items: center; justify-content: center" style-hover="color:#fff;">
          <i class="fa-regular fa-folder-open" style="font-size: 20px"></i>
        </button>
        <button aria-label="Search" style="width: 40px; height: 40px; border-radius: 8px; border: none; background: transparent; color: #8A8B93; cursor: pointer; display: flex; align-items: center; justify-content: center" style-hover="color:#fff;">
          <i class="fa-solid fa-magnifying-glass" style="font-size: 20px"></i>
        </button>
      </div>
      <button aria-label="Menu" style="margin-top: auto; width: 44px; height: 44px; border-radius: 8px; border: none; background: transparent; color: #8A8B93; cursor: pointer; display: flex; align-items: center; justify-content: center" style-hover="color:#fff;">
        <i class="fa-solid fa-bars" style="font-size:24px;"></i>
      </button>
    </nav>

    <!-- content slot -->
    <main style="flex:1 1 auto; min-width:0; background:transparent; overflow:auto;">
      <!-- Content goes here -->
    </main>
  </div>
</div>
</x-dc>
</body>
</html>
