  <noscript>Kontor financial layer needs JavaScript. Turn it on in your browser and reload the page.</noscript>
  <!--
    Script order matters. design-system/_ds_bundle.js ends with its own demo app that does
    ReactDOM.createRoot(document.getElementById('root')).render(...) inside a try/catch. It must run BEFORE
    <div id="root"> exists: getElementById returns null, the demo throws, the catch swallows it, and the Springboard
    components are still registered. If #root came first, the DS demo UI would flash up before the prototype mounts.
  -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="design-system/_ds_bundle.js"></script>
  <div id="root"></div>
