<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontor financial layer | Prototype</title>
  <meta name="color-scheme" content="dark light">
  <script>
    /* Set the theme before first paint. Default is dark. */
    (function () {
      var t = 'dark';
      try { var s = localStorage.getItem('kontor-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="design-system/styles.css">
  <link rel="stylesheet" href="dist/app.css">
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="design-system/_ds_bundle.js"></script>
  <script src="dist/app.js"></script>
</body>
</html>
